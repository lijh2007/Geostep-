name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: >
          gradle --no-daemon
          :core:model:test :core:route:test :core:data:test
          :module:testDebugUnitTest :core:engine:testDebugUnitTest
          -x :rootpayload:buildRootNative

      - name: Assemble app (prebuilt native)
        run: >
          gradle --no-daemon
          :app:assembleDebug
          -PprebuiltNative=true -PappAbis=arm64-v8a
          -x :rootpayload:buildRootNative
          -x :rootpayload:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: geostep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
